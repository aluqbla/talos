<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TɅLOS">
  <meta name="application-name" content="TɅLOS">
  <meta name="description" content="Panel privado de entrenamiento y recuperación de Antonio.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='23' fill='%2305070a'/%3E%3Cpath d='M19 75 50 19l31 56H66L50 46 34 75Z' fill='%235aaeff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <title>TɅLOS</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --panel: rgba(22, 27, 35, .74);
      --panel-strong: rgba(30, 36, 47, .92);
      --glass: rgba(255, 255, 255, .075);
      --line: rgba(255, 255, 255, .095);
      --text: #f7f9fc;
      --secondary: #b9c0cc;
      --muted: #7d8798;
      --blue: #5aaeff;
      --cyan: #67d9ff;
      --green: #46d47a;
      --amber: #ffbd4a;
      --red: #ff6862;
      --purple: #a98cff;
      --radius: 24px;
      --safe-top: max(16px, env(safe-area-inset-top));
      --safe-bottom: max(12px, env(safe-area-inset-bottom));
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }

    button, input, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .hidden { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }

    .app {
      width: min(1180px, 100%);
      min-height: 100dvh;
      margin: 0 auto;
      padding: 0 14px calc(92px + var(--safe-bottom));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 42px;
      align-items: center;
      gap: 14px;
      min-height: calc(72px + var(--safe-top));
      padding: var(--safe-top) 2px 10px;
      background: linear-gradient(to bottom, #000 72%, rgba(0, 0, 0, 0));
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
    }

    .topbar-spacer { width: 42px; height: 42px; }
    .brand { display: grid; justify-items: center; min-width: 0; text-align: center; }
    .brand-mark {
      margin: 0;
      width: min(228px, 100%);
      height: 35px;
      color: #f6f7f9;
      line-height: 0;
      filter: drop-shadow(0 0 9px rgba(255, 255, 255, .16));
    }
    .brand-mark svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .brand-view { margin-top: 5px; color: var(--muted); font-size: 9px; font-weight: 720; letter-spacing: .14em; text-transform: uppercase; }

    .icon-button, .primary-button, .secondary-button, .danger-button {
      border: 0;
      border-radius: 15px;
      min-height: 42px;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease, background .15s ease;
    }
    button:active { transform: scale(.975); }
    button:disabled { opacity: .48; cursor: wait; }
    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 42px;
      color: var(--text);
      background: var(--glass);
      border: 1px solid var(--line);
    }
    .icon-button.syncing svg { animation: rotate .9s linear infinite; }
    @keyframes rotate { to { transform: rotate(360deg); } }
    .primary-button { padding: 0 18px; color: #031120; background: var(--blue); font-weight: 760; }
    .secondary-button { padding: 0 16px; color: var(--text); background: var(--glass); border: 1px solid var(--line); font-weight: 680; }
    .danger-button { padding: 0 16px; color: #ffd7d4; background: rgba(255, 104, 98, .13); border: 1px solid rgba(255, 104, 98, .28); font-weight: 680; }

    .views { min-height: calc(100dvh - 170px); }
    .view { display: none; animation: appear .22s ease; }
    .view.active { display: block; }
    @keyframes appear { from { opacity: .4; transform: translateY(3px); } }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin: 12px 2px 8px;
    }
    .section-heading h2 { margin: 0; font-size: 16px; letter-spacing: -.02em; }
    .section-heading p { margin: 0; color: var(--muted); font-size: 12px; }

    .grid { display: grid; gap: 12px; }
    .today-grid { grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); }
    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(32, 39, 50, .79), rgba(17, 21, 28, .72));
      box-shadow: 0 18px 50px rgba(0, 0, 0, .22), inset 0 1px 0 rgba(255, 255, 255, .055);
      backdrop-filter: blur(24px) saturate(135%);
      -webkit-backdrop-filter: blur(24px) saturate(135%);
    }

    .readiness-card { padding: 17px; }
    .readiness-head { display: flex; align-items: center; gap: 17px; }
    .score-ring {
      --score: 0;
      --score-color: var(--blue);
      position: relative;
      display: grid;
      place-items: center;
      flex: 0 0 94px;
      width: 94px;
      height: 94px;
      border-radius: 50%;
      background: conic-gradient(var(--score-color) calc(var(--score) * 1%), rgba(255, 255, 255, .075) 0);
      box-shadow: 0 0 32px color-mix(in srgb, var(--score-color) 24%, transparent);
    }
    .score-ring::before { content: ""; position: absolute; inset: 7px; border-radius: inherit; background: #11161d; }
    .score-value { position: relative; font-size: 29px; font-weight: 790; letter-spacing: -.055em; }
    .score-copy { min-width: 0; }
    .eyebrow { margin: 0 0 4px; color: var(--muted); font-size: 11px; font-weight: 730; letter-spacing: .055em; text-transform: uppercase; }
    .score-copy h2 { margin: 0; font-size: clamp(23px, 5.8vw, 34px); letter-spacing: -.045em; }
    .score-copy p { margin: 5px 0 0; color: var(--secondary); line-height: 1.35; }

    .reason-list { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
    .reason-chip { padding: 7px 9px; border-radius: 999px; background: rgba(255, 255, 255, .055); color: var(--secondary); font-size: 12px; }
    .reason-chip.good { color: #bff4cf; background: rgba(70, 212, 122, .11); }
    .reason-chip.warn { color: #ffe0a6; background: rgba(255, 189, 74, .11); }

    .metric-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      margin-top: 15px;
      overflow: hidden;
      border-radius: 16px;
      background: var(--line);
    }
    .mini-metric { min-width: 0; padding: 10px 7px; text-align: center; background: rgba(14, 18, 24, .9); }
    .mini-metric span { display: block; color: var(--muted); font-size: 10px; white-space: nowrap; }
    .mini-metric strong { display: block; overflow: hidden; margin-top: 3px; font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }

    .data-card { padding: 16px; }
    .data-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .data-title h3 { margin: 0; font-size: 15px; letter-spacing: -.015em; }
    .data-title span { color: var(--muted); font-size: 11px; }
    .data-list { display: grid; gap: 0; }
    .data-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 38px; border-top: 1px solid var(--line); }
    .data-row:first-child { border-top: 0; }
    .data-row span { color: var(--secondary); }
    .data-row strong { text-align: right; font-variant-numeric: tabular-nums; }
    .data-row small { color: var(--muted); font-weight: 550; }

    .today-day-nav {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr) 40px;
      align-items: center;
      gap: 10px;
      margin: 5px 2px 10px;
    }
    .today-day-nav-copy { min-width: 0; text-align: center; }
    .today-day-nav-copy span { display: block; color: var(--muted); font-size: 9px; font-weight: 740; letter-spacing: .11em; text-transform: uppercase; }
    .today-day-nav-copy strong { display: block; margin-top: 2px; overflow: hidden; font-size: 15px; text-overflow: ellipsis; white-space: nowrap; }
    .day-nav-button {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--text);
      background: rgba(255, 255, 255, .055);
      font-size: 28px;
      font-weight: 300;
      line-height: 1;
      cursor: pointer;
    }
    .day-nav-button:disabled { opacity: .16; cursor: default; }
    .quality-excellent { color: #74e69a; }
    .quality-good { color: #8bc8ff; }
    .quality-fair { color: #ffd17a; }
    .quality-poor { color: #ff9792; }

    .form-card { grid-column: 1 / -1; padding: 16px; }
    .form-summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .form-summary h3 { margin: 0; font-size: 18px; }
    .form-summary p { margin: 4px 0 0; color: var(--secondary); }
    .status-pill { flex: 0 0 auto; padding: 7px 10px; border-radius: 999px; color: #c9e8ff; background: rgba(90, 174, 255, .12); font-size: 12px; font-weight: 730; }
    .load-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
    .load-item { padding: 11px; border-radius: 16px; background: rgba(255, 255, 255, .048); }
    .load-item span { display: block; color: var(--muted); font-size: 10px; }
    .load-item strong { display: block; margin-top: 4px; font-size: 18px; }

    .feelings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .feeling-field { min-width: 0; }
    .feeling-field label { display: block; margin: 0 0 5px; color: var(--muted); font-size: 10px; }
    .feeling-field select {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 0 8px;
      background: rgba(8, 11, 16, .65);
      color: var(--text);
      font-size: 13px;
    }

    .activity-list { display: grid; gap: 8px; }
    .activity-card {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      align-items: center;
      width: 100%;
      min-height: 67px;
      padding: 9px 11px;
      color: inherit;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: rgba(25, 31, 40, .7);
      cursor: pointer;
    }
    .activity-icon { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 14px; background: rgba(90, 174, 255, .12); font-size: 20px; }
    .activity-copy { min-width: 0; padding: 0 9px; }
    .activity-copy strong { display: block; overflow: hidden; margin-top: 3px; font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
    .activity-copy span { display: block; color: var(--muted); font-size: 10px; text-transform: capitalize; }
    .activity-stats { display: flex; gap: 18px; text-align: right; }
    .activity-stat span { display: block; color: var(--muted); font-size: 9px; text-transform: uppercase; }
    .activity-stat strong { display: block; margin-top: 1px; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
    .activity-stat small { display: block; margin-top: 3px; color: var(--secondary); font-size: 8px; font-weight: 650; white-space: nowrap; }

    .empty-state { padding: 36px 18px; text-align: center; }
    .empty-state .empty-icon { font-size: 34px; }
    .empty-state h3 { margin: 10px 0 5px; }
    .empty-state p { max-width: 450px; margin: 0 auto 16px; color: var(--muted); line-height: 1.45; }

    .calendar-card { padding: 12px; }
    .calendar-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 3px 2px 11px; }
    .calendar-toolbar h2 { display: grid; justify-items: center; margin: 0; text-transform: capitalize; }
    .calendar-year { color: var(--muted); font-size: 9px; font-weight: 720; letter-spacing: .12em; }
    .calendar-month { margin-top: 1px; font-size: 19px; }
    .month-buttons { display: flex; gap: 6px; }
    .month-buttons button { width: 36px; min-height: 36px; border: 1px solid var(--line); border-radius: 12px; color: var(--text); background: var(--glass); }
    .weekdays, .month-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .weekdays span { padding: 5px 2px 8px; color: var(--muted); text-align: center; font-size: 10px; font-weight: 720; }
    .month-grid { gap: 4px; }
    .day-cell {
      position: relative;
      display: block;
      min-width: 0;
      min-height: 86px;
      padding: 6px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .055);
      border-radius: 13px;
      background: rgba(255, 255, 255, .027);
      color: inherit;
      text-align: left;
      cursor: pointer;
    }
    .day-cell.blank { visibility: hidden; }
    .day-cell.today { border-color: rgba(90, 174, 255, .55); background: rgba(90, 174, 255, .07); }
    .day-cell.selected { border-color: rgba(169, 140, 255, .72); box-shadow: inset 0 0 0 1px rgba(169, 140, 255, .22); }
    .day-number { display: inline-grid; place-items: center; width: 23px; height: 23px; border-radius: 50%; color: var(--secondary); font-size: 11px; }
    .today .day-number { color: #02111f; background: var(--blue); font-weight: 800; }
    .day-items { display: grid; gap: 3px; margin-top: 3px; }
    .day-item { overflow: hidden; padding: 3px 4px; border-radius: 7px; background: rgba(90, 174, 255, .11); color: #c9e8ff; font-size: 9px; line-height: 1.15; text-overflow: ellipsis; white-space: nowrap; }
    .day-item.done { color: #c8f6d6; background: rgba(70, 212, 122, .11); }
    .day-more { color: var(--muted); font-size: 9px; }
    .day-health { display: block; margin-top: 5px; font-variant-numeric: tabular-nums; }
    .day-sleep {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 2px;
      padding: 4px 2px;
      border-radius: 7px;
      background: rgba(255, 255, 255, .045);
      font-size: clamp(9px, 1.4vw, 13px);
      font-weight: 800;
      letter-spacing: -.035em;
      line-height: 1;
      white-space: nowrap;
    }

    .plan-day-detail { margin-top: 10px; padding: 14px; }
    .plan-day-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .plan-day-head h3 { margin: 2px 0 0; font-size: 17px; text-transform: capitalize; }
    .plan-day-head p { margin: 0; color: var(--muted); font-size: 10px; text-transform: uppercase; }
    .day-health-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 11px; }
    .day-health-metric { min-width: 0; padding: 9px; border-radius: 13px; background: rgba(255, 255, 255, .04); }
    .day-health-metric span { display: block; color: var(--muted); font-size: 9px; }
    .day-health-metric strong { display: block; margin-top: 3px; font-size: 14px; font-variant-numeric: tabular-nums; }
    .plan-day-section { margin-top: 12px; }
    .plan-day-section h4 { margin: 0 0 6px; color: var(--secondary); font-size: 11px; text-transform: uppercase; }
    .plan-activity-button { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; width: 100%; padding: 9px; border: 1px solid var(--line); border-radius: 14px; background: rgba(90, 174, 255, .065); color: inherit; text-align: left; cursor: pointer; }
    .plan-activity-button + .plan-activity-button { margin-top: 6px; }
    .plan-activity-button .sport { font-size: 20px; }
    .plan-activity-button .copy { min-width: 0; }
    .plan-activity-button .copy strong, .plan-activity-button .copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .plan-activity-button .copy strong { font-size: 12px; }
    .plan-activity-button .copy span { margin-top: 2px; color: var(--muted); font-size: 10px; }
    .plan-activity-button .open { color: var(--blue); font-size: 16px; }
    .plan-empty { margin: 9px 0 0; color: var(--muted); font-size: 11px; }

    .manage-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .manage-card { padding: 16px; }
    .manage-card h3 { margin: 0 0 5px; font-size: 16px; }
    .manage-card p { margin: 0 0 14px; color: var(--muted); line-height: 1.4; }
    .button-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .connection-dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--muted); }
    .connection-dot.ok { background: var(--green); box-shadow: 0 0 11px rgba(70, 212, 122, .6); }
    .manage-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin: 12px 0; }
    .manage-stat { padding: 10px 7px; border-radius: 13px; text-align: center; background: rgba(255, 255, 255, .04); }
    .manage-stat strong { display: block; font-size: 18px; }
    .manage-stat span { display: block; margin-top: 2px; color: var(--muted); font-size: 9px; }

    .bottom-nav {
      position: fixed;
      z-index: 40;
      left: 50%;
      bottom: max(8px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      width: min(520px, calc(100% - 24px));
      padding: 6px;
      transform: translateX(-50%);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 24px;
      background: rgba(25, 30, 39, .78);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .52), inset 0 1px 0 rgba(255, 255, 255, .08);
      backdrop-filter: blur(28px) saturate(170%);
      -webkit-backdrop-filter: blur(28px) saturate(170%);
    }
    .nav-button { display: grid; place-items: center; gap: 2px; min-height: 52px; border: 0; border-radius: 18px; color: var(--muted); background: transparent; cursor: pointer; }
    .nav-button svg { width: 21px; height: 21px; }
    .nav-button span { font-size: 9px; font-weight: 680; }
    .nav-button.active { color: var(--blue); background: rgba(90, 174, 255, .11); }

    dialog {
      width: min(680px, calc(100% - 18px));
      max-height: calc(100dvh - 18px);
      margin: auto;
      padding: 0;
      overflow: hidden;
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 28px;
      background: #10151c;
      box-shadow: 0 28px 90px rgba(0, 0, 0, .72);
    }
    dialog::backdrop { background: rgba(0, 0, 0, .72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .dialog-shell { max-height: calc(100dvh - 18px); overflow-y: auto; overscroll-behavior: contain; }
    .dialog-header { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 15px 10px; background: rgba(16, 21, 28, .9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .dialog-header h2 { margin: 0; overflow: hidden; font-size: 19px; text-overflow: ellipsis; white-space: nowrap; }
    .dialog-content { padding: 0 15px 18px; }
    .dialog-content label { display: block; margin: 13px 0 6px; color: var(--secondary); font-size: 12px; }
    .dialog-content input {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0 13px;
      background: rgba(5, 8, 12, .62);
      color: var(--text);
      font-size: 16px;
    }
    .dialog-note { margin: 10px 1px 0; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

    .activity-hero { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 12px; }
    .hero-stat { padding: 12px 9px; border-radius: 16px; background: rgba(255, 255, 255, .045); text-align: center; }
    .hero-stat span { display: block; color: var(--muted); font-size: 9px; text-transform: uppercase; }
    .hero-stat strong { display: block; margin-top: 4px; font-size: 19px; }
    .route-wrap { position: relative; height: 270px; overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: #0a0e13; }
    #routeMap { width: 100%; height: 100%; }
    .map-message { position: absolute; z-index: 500; inset: 0; display: grid; place-items: center; padding: 20px; color: var(--muted); text-align: center; pointer-events: none; background: radial-gradient(circle, rgba(20, 30, 42, .55), #090d12); }
    .leaflet-container { background: #0a0e13; font-family: var(--font); }
    .leaflet-tile-pane { filter: brightness(.48) saturate(.54) contrast(1.2); }
    .leaflet-control-attribution { background: rgba(4, 7, 10, .72) !important; color: #9ba4b2; font-size: 9px !important; }
    .leaflet-control-attribution a { color: #9ed1ff; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; margin-top: 12px; }
    .detail-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 9px 11px; border-radius: 14px; background: rgba(255, 255, 255, .04); }
    .detail-item span { color: var(--muted); font-size: 11px; }
    .detail-item strong { text-align: right; font-size: 13px; }
    .interval-list { display: grid; gap: 6px; margin-top: 8px; }
    .interval-row { padding: 8px 9px; border-radius: 12px; background: rgba(255, 255, 255, .035); }
    .interval-copy { display: grid; grid-template-columns: 30px 1fr 1fr 1fr; gap: 8px; align-items: center; font-size: 10px; }
    .interval-copy span:not(:first-child) { text-align: right; }
    .interval-track { height: 12px; margin-top: 7px; overflow: hidden; border-radius: 4px; background: rgba(255, 255, 255, .045); }
    .interval-bar { height: 100%; min-width: 5px; border-radius: 3px; box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .2), 0 0 12px color-mix(in srgb, var(--bar-color) 24%, transparent); }

    .toast {
      position: fixed;
      z-index: 100;
      left: 50%;
      top: calc(var(--safe-top) + 8px);
      width: min(430px, calc(100% - 28px));
      padding: 11px 14px;
      transform: translate(-50%, -140%);
      opacity: 0;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 15px;
      background: rgba(26, 32, 41, .94);
      color: var(--text);
      box-shadow: 0 14px 45px rgba(0, 0, 0, .45);
      transition: transform .25s ease, opacity .25s ease;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .toast.error { border-color: rgba(255, 104, 98, .32); color: #ffd3d1; }

    @media (max-width: 760px) {
      .today-grid, .manage-grid { grid-template-columns: 1fr; }
      .form-card { grid-column: auto; }
      .day-cell { min-height: 82px; padding: 4px; border-radius: 10px; }
      .day-number { width: 20px; height: 20px; }
      .day-item { padding: 3px; font-size: 0; }
      .day-item::first-letter { font-size: 12px; }
      .day-sleep { font-size: 10px; }
      .day-health-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .activity-card { grid-template-columns: 39px minmax(0, 1fr) auto; padding-inline: 8px; }
      .activity-stats { gap: 11px; }
      .activity-stat strong { font-size: 21px; }
    }

    @media (max-width: 420px) {
      .app { padding-inline: 10px; }
      .brand-mark { width: min(210px, 100%); height: 33px; }
      .readiness-head { gap: 13px; }
      .score-ring { flex-basis: 82px; width: 82px; height: 82px; }
      .score-value { font-size: 26px; }
      .metric-strip { grid-template-columns: repeat(4, minmax(64px, 1fr)); overflow-x: auto; }
      .load-grid { grid-template-columns: repeat(4, minmax(68px, 1fr)); overflow-x: auto; }
      .load-item strong { font-size: 16px; }
      .route-wrap { height: 235px; }
      .detail-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <dialog id="connectionDialog">
    <div class="dialog-shell">

  <dialog id="activityDialog">

  <input class="hidden" id="importInput" type="file" accept="application/json,.json">
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
  (() => {
    "use strict";

    const APP_VERSION = "0.7.0";
    const DEFAULT_WORKER_URL = "https://intervals.aj-luque.workers.dev";
    const CONNECTION_DB = "talos-connection";
    const CONNECTION_STORE = "settings";
    const DATA_DB_DEFAULT = "talos";
    const DATA_STORES = {
      activities: "syncActivities",
      wellness: "syncWellness",
      calendar: "syncCalendar",
      streams: "activityStreams",
      settings: "appSettings",
      subjective: "dailySubjective"
    };
    const VIEW_LABELS = { today: "Hoy", activities: "Actividades", plan: "Plan", manage: "Gestión" };
    const TIME_ZONE = "Europe/Madrid";
    const DAY_MS = 86400000;
    const STREAM_CACHE_VERSION = 3;

    const state = {
      activities: [],
      wellness: [],
      calendar: [],
      subjective: null,
      lastSyncAt: null,
      workerUrl: DEFAULT_WORKER_URL,
      hasToken: false,
      syncing: false,
      activeView: "today",
      selectedTodayDate: null,
      monthCursor: new Date(),
      selectedPlanDate: null,
      dataDbName: null,
      map: null,
      mapLayer: null,
      toastTimer: null
    };

    let dataDbPromise = null;
    let connectionDbPromise = null;

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
    const isNumber = value => typeof value === "number" && Number.isFinite(value);

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"]/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[character]);
    }

    function todayKey() {
      return new Intl.DateTimeFormat("en-CA", { timeZone: TIME_ZONE, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
    }

    function dateFromKey(value) {
      const key = String(value || "").slice(0, 10);
      return /^\d{4}-\d{2}-\d{2}$/.test(key) ? new Date(`${key}T12:00:00`) : null;
    }

    function activityDateKey(activity) {
      return String(activity?.start?.local || activity?.start?.utc || "").slice(0, 10);
    }

    function formatDate(value, options = { day: "numeric", month: "short", year: "numeric" }) {
      const date = dateFromKey(value) || (value ? new Date(value) : null);
      if (!date || Number.isNaN(date.getTime())) return "—";
      return new Intl.DateTimeFormat("es-ES", options).format(date);
    }

    function formatFullDate(value) {
      const text = formatDate(value, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
      return text === "—" ? text : text.charAt(0).toUpperCase() + text.slice(1);
    }

    function formatNumber(value, digits = 0) {
      return isNumber(value) ? new Intl.NumberFormat("es-ES", { minimumFractionDigits: digits, maximumFractionDigits: digits }).format(value) : "—";
    }

    function formatDistance(meters) {
      return isNumber(meters) ? `${formatNumber(meters / 1000, 2)} km` : "—";
    }

    function formatDuration(seconds) {
      if (!isNumber(seconds)) return "—";
      const rounded = Math.max(0, Math.round(seconds));
      const hours = Math.floor(rounded / 3600);
      const minutes = Math.floor((rounded % 3600) / 60);
      const secs = rounded % 60;
      return hours ? `${hours}:${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}` : `${minutes}:${String(secs).padStart(2, "0")}`;
    }

    function formatSleep(seconds) {
      if (!isNumber(seconds)) return "—";
      const minutes = Math.round(seconds / 60);
      return `${Math.floor(minutes / 60)} h ${String(minutes % 60).padStart(2, "0")} min`;
    }

    function formatCompactSleep(seconds) {
      if (!isNumber(seconds)) return null;
      const minutes = Math.round(seconds / 60);
      return `${Math.floor(minutes / 60)}h${String(minutes % 60).padStart(2, "0")}`;
    }

    function formatPace(secondsPerKm) {
      if (!isNumber(secondsPerKm) || secondsPerKm <= 0) return "—";
      const rounded = Math.round(secondsPerKm);
      return `${Math.floor(rounded / 60)}:${String(rounded % 60).padStart(2, "0")}`;
    }

    function median(values) {
      const rows = values.filter(isNumber).sort((a, b) => a - b);
      if (!rows.length) return null;
      const middle = Math.floor(rows.length / 2);
      return rows.length % 2 ? rows[middle] : (rows[middle - 1] + rows[middle]) / 2;
    }

    function requestResult(request) {
      return new Promise((resolve, reject) => {
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error("Error de IndexedDB."));
      });
    }

    function transactionDone(transaction) {
      return new Promise((resolve, reject) => {
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error || new Error("No se pudo guardar la información."));
        transaction.onabort = () => reject(transaction.error || new Error("La operación se canceló."));
      });
    }

    function ensureConnectionDb() {
      if (connectionDbPromise) return connectionDbPromise;
      connectionDbPromise = new Promise((resolve, reject) => {
        const request = indexedDB.open(CONNECTION_DB, 1);
        request.onupgradeneeded = () => {
          if (!request.result.objectStoreNames.contains(CONNECTION_STORE)) request.result.createObjectStore(CONNECTION_STORE);
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
        request.onblocked = () => reject(new Error("Cierra otras pestañas de TɅLOS para actualizar la conexión."));
      });
      return connectionDbPromise;
    }

    async function connectionGet(key) {
      const db = await ensureConnectionDb();
      return requestResult(db.transaction(CONNECTION_STORE, "readonly").objectStore(CONNECTION_STORE).get(key));
    }

    async function connectionSet(key, value) {
      const db = await ensureConnectionDb();
      const transaction = db.transaction(CONNECTION_STORE, "readwrite");
      transaction.objectStore(CONNECTION_STORE).put(value, key);
      await transactionDone(transaction);
    }

    function createDataStores(db) {
      const definitions = [
        [DATA_STORES.activities, "id"],
        [DATA_STORES.wellness, "date"],
        [DATA_STORES.calendar, "dedupeKey"],
        [DATA_STORES.streams, "id"],
        [DATA_STORES.settings, "key"],
        [DATA_STORES.subjective, "date"]
      ];
      for (const [name, keyPath] of definitions) {
        if (!db.objectStoreNames.contains(name)) db.createObjectStore(name, { keyPath });
      }
    }

    function openDatabase(name, version) {
      return new Promise((resolve, reject) => {
        const request = version ? indexedDB.open(name, version) : indexedDB.open(name);
        request.onupgradeneeded = () => createDataStores(request.result);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
        request.onblocked = () => reject(new Error("Cierra otras pestañas de TɅLOS para actualizar la base de datos."));
      });
    }

    async function selectDataDbName() {
      const saved = await connectionGet("dataDbName").catch(() => null);
      if (saved && saved !== CONNECTION_DB) return saved;
      let selected = DATA_DB_DEFAULT;
      if (typeof indexedDB.databases === "function") {
        try {
          const candidates = (await indexedDB.databases())
            .filter(item => item?.name && item.name !== CONNECTION_DB && /talos/i.test(item.name))
            .sort((a, b) => (b.version || 0) - (a.version || 0));
          if (candidates[0]?.name) selected = candidates[0].name;
        } catch (_) {}
      }
      await connectionSet("dataDbName", selected);
      return selected;
    }

    async function ensureDataDb() {
      if (dataDbPromise) return dataDbPromise;
      dataDbPromise = (async () => {
        state.dataDbName = await selectDataDbName();
        let db = await openDatabase(state.dataDbName);
        const required = Object.values(DATA_STORES);
        const missing = required.some(name => !db.objectStoreNames.contains(name));
        if (missing) {
          const nextVersion = Math.max(1, db.version + 1);
          db.close();
          db = await openDatabase(state.dataDbName, nextVersion);
        }
        return db;
      })();
      return dataDbPromise;
    }

    async function storeGetAll(storeName) {
      const db = await ensureDataDb();
      return requestResult(db.transaction(storeName, "readonly").objectStore(storeName).getAll());
    }

    async function storeGet(storeName, key) {
      const db = await ensureDataDb();
      return requestResult(db.transaction(storeName, "readonly").objectStore(storeName).get(key));
    }

    async function storePut(storeName, value) {
      const db = await ensureDataDb();
      const transaction = db.transaction(storeName, "readwrite");
      transaction.objectStore(storeName).put(value);
      await transactionDone(transaction);
    }

    async function storePutMany(storeName, values) {
      if (!values.length) return;
      const db = await ensureDataDb();
      const transaction = db.transaction(storeName, "readwrite");
      const store = transaction.objectStore(storeName);
      values.forEach(value => store.put(value));
      await transactionDone(transaction);
    }

    async function storeClear(storeNames) {
      const db = await ensureDataDb();
      const transaction = db.transaction(storeNames, "readwrite");
      storeNames.forEach(name => transaction.objectStore(name).clear());
      await transactionDone(transaction);
    }

    async function settingGet(key) {
      const value = await storeGet(DATA_STORES.settings, key);
      return value?.value ?? null;
    }

    async function settingSet(key, value) {
      return storePut(DATA_STORES.settings, { key, value, updatedAt: new Date().toISOString() });
    }

    function normalizeActivity(activity) {
      const item = activity && typeof activity === "object" ? structuredClone(activity) : {};
      if (!item.id) return null;
      item.id = String(item.id);
      item.name = item.name || "Actividad";
      item.runningDynamics ||= {};
      if (!isNumber(item.runningDynamics.averageCadenceSpm) && isNumber(item.runningDynamics.averageCadenceRpm)) {
        item.runningDynamics.averageCadenceSpm = Math.round(item.runningDynamics.averageCadenceRpm * 20) / 10;
      }
      if (!isNumber(item.runningDynamics.verticalOscillationCm) && isNumber(item.runningDynamics.verticalOscillationMm)) {
        item.runningDynamics.verticalOscillationCm = Math.round(item.runningDynamics.verticalOscillationMm) / 10;
      }
      item.streamTypes = Array.isArray(item.streamTypes) ? item.streamTypes : item.streams?.availableTypes || [];
      return item;
    }

    function normalizeWellness(row) {
      const item = row && typeof row === "object" ? structuredClone(row) : {};
      if (!item.date) return null;
      item.recovery ||= {};
      item.load ||= {};
      item.body ||= {};
      if (!isNumber(item.load.form) && isNumber(item.load.ctl) && isNumber(item.load.atl)) item.load.form = item.load.ctl - item.load.atl;
      if (!item.recovery.sleepQualityLabel && isNumber(item.recovery.sleepQuality)) {
        item.recovery.sleepQualityLabel = ({ 1: "excellent", 2: "good", 3: "fair", 4: "poor" })[item.recovery.sleepQuality] || null;
      }
      return item;
    }

    async function loadLocalData() {
      const [activities, wellness, calendar, lastSyncAt, workerUrl, subjective] = await Promise.all([
        storeGetAll(DATA_STORES.activities),
        storeGetAll(DATA_STORES.wellness),
        storeGetAll(DATA_STORES.calendar),
        settingGet("lastSyncAt"),
        connectionGet("workerUrl").catch(() => null),
        storeGet(DATA_STORES.subjective, todayKey())
      ]);
      state.activities = activities.map(normalizeActivity).filter(Boolean).sort((a, b) => String(a.start?.local || "").localeCompare(String(b.start?.local || "")));
      state.wellness = wellness.map(normalizeWellness).filter(Boolean).sort((a, b) => a.date.localeCompare(b.date));
      state.calendar = calendar.sort((a, b) => String(a.startLocal || "").localeCompare(String(b.startLocal || "")));
      state.lastSyncAt = lastSyncAt;
      state.workerUrl = normalizeWorkerUrl(workerUrl || DEFAULT_WORKER_URL);
      state.hasToken = Boolean(await connectionGet("accessToken").catch(() => ""));
      state.subjective = subjective || { date: todayKey(), energy: 0, legs: 0, discomfort: 0 };
    }

    function normalizeWorkerUrl(value) {
      try {
        const url = new URL(String(value || DEFAULT_WORKER_URL));
        if (url.protocol !== "https:") throw new Error();
        return url.origin + url.pathname.replace(/\/+$/, "");
      } catch (_) {
        return DEFAULT_WORKER_URL;
      }
    }

    async function persistSyncPayload(payload, { reload = true } = {}) {
      const activities = (payload.activities || []).map(normalizeActivity).filter(Boolean);
      const wellness = (payload.wellness || []).map(normalizeWellness).filter(Boolean);
      const calendar = (payload.calendar || []).filter(item => item?.dedupeKey);
      const knownActivities = new Set(state.activities.map(item => item.id));
      const knownWellness = new Set(state.wellness.map(item => item.date));
      const newActivities = activities.filter(item => !knownActivities.has(item.id)).length;
      const newWellness = wellness.filter(item => !knownWellness.has(item.date)).length;
      await storePutMany(DATA_STORES.activities, activities);
      await storePutMany(DATA_STORES.wellness, wellness);
      await storePutMany(DATA_STORES.calendar, calendar);
      const syncAt = payload.nextSync?.lastSuccessfulSyncAt || payload.generatedAt || new Date().toISOString();
      await settingSet("lastSyncAt", syncAt);
      await settingSet("lastWorkerVersion", payload.workerVersion || null);
      if (reload) await loadLocalData();
      return { newActivities, newWellness, activityCount: activities.length, wellnessCount: wellness.length };
    }

    function weightedScore(parts) {
      const valid = parts.filter(part => isNumber(part.score) && part.weight > 0);
      const totalWeight = valid.reduce((sum, part) => sum + part.weight, 0);
      if (!totalWeight) return null;
      return Math.round(valid.reduce((sum, part) => sum + clamp(part.score, 0, 100) * part.weight, 0) / totalWeight);
    }

    function calculateReadiness(current) {
      if (!current) return { score: null, label: "Sin datos", color: "var(--muted)", reasons: [] };
      const previous = state.wellness.filter(item => item.date < current.date).slice(-28);
      const hrv = current.recovery?.hrvRmssdMs;
      const resting = current.recovery?.restingHeartRateBpm;
      const sleepScore = current.recovery?.sleepScore;
      const sleepSeconds = current.recovery?.sleepSeconds;
      const hrvBase = median(previous.map(item => item.recovery?.hrvRmssdMs));
      const restingBase = median(previous.map(item => item.recovery?.restingHeartRateBpm));
      const hrvScore = isNumber(hrv) && isNumber(hrvBase) && hrvBase > 0 ? clamp(70 + ((hrv / hrvBase) - 1) * 200, 20, 100) : null;
      const restingScore = isNumber(resting) && isNumber(restingBase) && restingBase > 0 ? clamp(70 + ((restingBase - resting) / restingBase) * 400, 20, 100) : null;
      const durationScore = isNumber(sleepSeconds) ? clamp(((sleepSeconds / 3600) - 4) * 25, 0, 100) : null;
      const ctl = current.load?.ctl;
      const atl = current.load?.atl;
      let loadScore = null;
      if (isNumber(ctl) && ctl > 0 && isNumber(atl)) {
        const ratio = atl / ctl;
        loadScore = ratio <= .8 ? 90 : ratio <= 1.15 ? 76 : ratio <= 1.45 ? 56 : ratio <= 1.8 ? 38 : 22;
      }
      let subjectiveScore = null;
      const subjective = current.date === todayKey() ? state.subjective : null;
      if (subjective && [subjective.energy, subjective.legs, subjective.discomfort].some(value => Number(value) > 0)) {
        const energy = Number(subjective.energy) || 3;
        const legs = Number(subjective.legs) || 3;
        const discomfort = Number(subjective.discomfort) || 1;
        subjectiveScore = clamp(((energy + legs + (6 - discomfort)) / 15) * 100, 0, 100);
      }
      const score = weightedScore([
        { score: hrvScore, weight: 28 },
        { score: restingScore, weight: 17 },
        { score: sleepScore, weight: 23 },
        { score: durationScore, weight: 15 },
        { score: loadScore, weight: 12 },
        { score: subjectiveScore, weight: 5 }
      ]);
      const label = score === null ? "Sin datos" : score >= 85 ? "Preparado" : score >= 70 ? "Disponible" : score >= 55 ? "Moderado" : score >= 40 ? "Cauto" : "Recuperación";
      const color = score === null ? "var(--muted)" : score >= 80 ? "var(--green)" : score >= 65 ? "var(--blue)" : score >= 50 ? "var(--amber)" : "var(--red)";
      const reasons = [];
      if (isNumber(hrv) && isNumber(hrvBase)) {
        const delta = ((hrv / hrvBase) - 1) * 100;
        reasons.push({ text: `VFC ${Math.abs(delta) < 5 ? "estable" : delta > 0 ? "sobre tu base" : "bajo tu base"}`, good: delta >= -5 });
      }
      if (isNumber(sleepScore)) reasons.push({ text: `Sueño ${Math.round(sleepScore)}/100`, good: sleepScore >= 75 });
      if (isNumber(resting) && isNumber(restingBase)) reasons.push({ text: `FC reposo ${resting <= restingBase + 1 ? "normal" : "elevada"}`, good: resting <= restingBase + 1 });
      if (isNumber(ctl) && isNumber(atl)) reasons.push({ text: atl <= ctl ? "Carga reciente baja" : "Fatiga acumulada", good: atl <= ctl * 1.15 });
      return { score, label, color, reasons, hrvBase, restingBase };
    }

    function calculateForm(current) {
      if (!current || !isNumber(current.load?.ctl)) return { label: "Sin tendencia", detail: "Aún no hay suficientes datos de carga." };
      const priorRows = state.wellness.filter(item => item.date < current.date && isNumber(item.load?.ctl));
      const reference = priorRows.length ? priorRows[Math.max(0, priorRows.length - 28)] : null;
      if (!reference || !isNumber(reference.load?.ctl) || reference.load.ctl === 0) return { label: "En observación", detail: `CTL actual ${formatNumber(current.load.ctl, 1)}.` };
      const change = ((current.load.ctl / reference.load.ctl) - 1) * 100;
      const label = change > 5 ? "Mejorando" : change < -5 ? "Descendiendo" : "Estable";
      return { label, detail: `CTL ${change >= 0 ? "+" : ""}${formatNumber(change, 0)} % frente a ${formatDate(reference.date, { day: "numeric", month: "short" })}.` };
    }

    function qualityLabel(value) {
      return ({ excellent: "Excelente", good: "Bueno", fair: "Regular", poor: "Malo" })[value] || "Sin datos";
    }

    function qualityClass(value) {
      return ({ excellent: "quality-excellent", good: "quality-good", fair: "quality-fair", poor: "quality-poor" })[value] || "";
    }

    function recentDayKeys(total = 7) {
      const today = dateFromKey(todayKey());
      return Array.from({ length: total }, (_, offset) => {
        const date = new Date(today.getFullYear(), today.getMonth(), today.getDate() - offset, 12);
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      });
    }

    function renderToday() {
      const dayKeys = recentDayKeys(7);
      const currentDate = dayKeys.includes(state.selectedTodayDate) ? state.selectedTodayDate : dayKeys[0];
      const selectedIndex = dayKeys.indexOf(currentDate);
      const wellness = state.wellness.find(item => item.date === currentDate);
      const current = wellness || { date: currentDate, recovery: {}, load: {}, body: {} };
      const isToday = selectedIndex === 0;
      state.selectedTodayDate = currentDate;
      const readiness = calculateReadiness(current);
      const form = calculateForm(current);
      const recovery = current?.recovery || {};
      const load = current?.load || {};
      const body = current?.body || {};
      const hrvRecent = median(state.wellness.filter(item => item.date <= (current?.date || todayKey())).slice(-7).map(item => item.recovery?.hrvRmssdMs));
      const scoreText = readiness.score === null ? "—" : readiness.score;
      const reasons = readiness.reasons.length ? readiness.reasons.map(reason => `<span class="reason-chip ${reason.good ? "good" : "warn"}">${escapeHtml(reason.text)}</span>`).join("") : '<span class="reason-chip">Sin información suficiente</span>';
      const subjective = state.subjective || {};
      const feelingsMarkup = isToday ? `
          <article class="card data-card form-card">
            <div class="data-title"><h3>Cómo te encuentras hoy</h3><span>Opcional · guardado local</span></div>
            <div class="feelings">
              ${feelingSelect("energy", "⚡ Energía", subjective.energy, ["Sin registrar", "Muy baja", "Baja", "Normal", "Buena", "Muy buena"])}
              ${feelingSelect("legs", "🦵 Piernas", subjective.legs, ["Sin registrar", "Muy cargadas", "Cargadas", "Normales", "Sueltas", "Muy sueltas"])}
              ${feelingSelect("discomfort", "🩹 Molestias", subjective.discomfort, ["Sin registrar", "Ninguna", "Leve", "Moderada", "Alta", "Limitante"])}
            </div>
          </article>` : "";

      $("#todayContent").innerHTML = `
        <div class="today-day-nav" aria-label="Navegar por los últimos siete días">
          <button class="day-nav-button" type="button" data-today-index="${selectedIndex + 1}" aria-label="Ver el día anterior" ${selectedIndex >= dayKeys.length - 1 ? "disabled" : ""}>‹</button>
          <div class="today-day-nav-copy"><span>${isToday ? "Hoy" : selectedIndex === 1 ? "Ayer" : `Hace ${selectedIndex} días`}</span><strong>${formatFullDate(currentDate)}</strong></div>
          <button class="day-nav-button" type="button" data-today-index="${selectedIndex - 1}" aria-label="Ver el día siguiente" ${isToday ? "disabled" : ""}>›</button>
        </div>
        <div class="grid today-grid">
          <article class="card readiness-card">
            <div class="readiness-head">
              <div class="score-ring" style="--score:${readiness.score || 0};--score-color:${readiness.color}"><span class="score-value">${scoreText}</span></div>
              <div class="score-copy"><p class="eyebrow">Disponibilidad del día</p><h2>${escapeHtml(readiness.label)}</h2><p>${wellness ? "Datos sincronizados" : "Sin datos sincronizados para este día"}</p></div>
            </div>
            <div class="reason-list">${reasons}</div>
            <div class="metric-strip">
              <div class="mini-metric"><span>💤 Sueño</span><strong>${formatSleep(recovery.sleepSeconds)}</strong></div>
              <div class="mini-metric"><span>〰️ VFC</span><strong>${isNumber(recovery.hrvRmssdMs) ? `${formatNumber(recovery.hrvRmssdMs)} ms` : "—"}</strong></div>
              <div class="mini-metric"><span>❤️ Reposo</span><strong>${isNumber(recovery.restingHeartRateBpm) ? `${formatNumber(recovery.restingHeartRateBpm)} ppm` : "—"}</strong></div>
              <div class="mini-metric"><span>👟 Pasos</span><strong>${isNumber(body.steps) ? formatNumber(body.steps) : "—"}</strong></div>
            </div>
          </article>

          <article class="card data-card">
            <div class="data-title"><h3>Variabilidad de la frecuencia cardiaca</h3><span>RMSSD</span></div>
            <div class="data-list">
              <div class="data-row"><span>🌙 Media nocturna</span><strong>${isNumber(recovery.hrvRmssdMs) ? `${formatNumber(recovery.hrvRmssdMs)} <small>ms</small>` : "—"}</strong></div>
              <div class="data-row"><span>📅 Media de 7 días</span><strong>${isNumber(hrvRecent) ? `${formatNumber(hrvRecent)} <small>ms</small>` : "—"}</strong></div>
              <div class="data-row"><span>📊 Línea base de 28 días</span><strong>${isNumber(readiness.hrvBase) ? `${formatNumber(readiness.hrvBase)} <small>ms</small>` : "—"}</strong></div>
              <div class="data-row"><span>💤 Calidad del sueño</span><strong>${qualityLabel(recovery.sleepQualityLabel)}${isNumber(recovery.sleepScore) ? ` · ${formatNumber(recovery.sleepScore)}` : ""}</strong></div>
            </div>
          </article>

          <article class="card form-card">
            <div class="form-summary"><div><p class="eyebrow">Estado de forma</p><h3>${escapeHtml(form.label)}</h3><p>${escapeHtml(form.detail)}</p></div><span class="status-pill">Transparente</span></div>
            <div class="load-grid">
              <div class="load-item"><span>CTL · forma</span><strong>${formatNumber(load.ctl, 1)}</strong></div>
              <div class="load-item"><span>ATL · fatiga</span><strong>${formatNumber(load.atl, 1)}</strong></div>
              <div class="load-item"><span>Forma</span><strong>${isNumber(load.form) ? `${load.form >= 0 ? "+" : ""}${formatNumber(load.form, 1)}` : "—"}</strong></div>
              <div class="load-item"><span>Ramp rate</span><strong>${isNumber(load.rampRate) ? `${load.rampRate >= 0 ? "+" : ""}${formatNumber(load.rampRate, 1)}` : "—"}</strong></div>
            </div>
          </article>

          ${feelingsMarkup}
        </div>`;

      $$('[data-feeling]', $("#todayContent")).forEach(select => select.addEventListener("change", saveSubjective));
      $$('[data-today-index]', $("#todayContent")).forEach(button => button.addEventListener("click", () => {
        state.selectedTodayDate = dayKeys[Number(button.dataset.todayIndex)];
        renderToday();
      }));
    }

    function feelingSelect(key, label, selected, options) {
      return `<div class="feeling-field"><label for="feeling-${key}">${label}</label><select id="feeling-${key}" data-feeling="${key}">${options.map((option, index) => `<option value="${index}" ${Number(selected) === index ? "selected" : ""}>${escapeHtml(option)}</option>`).join("")}</select></div>`;
    }

    async function saveSubjective(event) {
      state.subjective ||= { date: todayKey(), energy: 0, legs: 0, discomfort: 0 };
      state.subjective[event.target.dataset.feeling] = Number(event.target.value);
      state.subjective.updatedAt = new Date().toISOString();
      await storePut(DATA_STORES.subjective, state.subjective);
      renderToday();
      showToast("Sensaciones guardadas en este dispositivo.");
    }

    function activityIcon(type, label = "") {
      const value = `${type || ""} ${label || ""}`.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
      if (/hiit|crossfit|circuit|cardio/.test(value)) return "🔥";
      if (/strength|weight|gym|fuerza|pesas/.test(value)) return "🏋🏻‍♂️";
      if (/hike|hiking|sender/.test(value)) return "🥾";
      if (/walk|walking|caminata|andar/.test(value)) return "🚶🏻‍♂️";
      if (/run|running|carrera/.test(value)) return "🏃🏻‍♂️";
      if (/ride|bike|cycle|cycling|ciclismo|bicicleta/.test(value)) return "🚴🏻‍♂️";
      if (/swim|natacion/.test(value)) return "🏊🏻‍♂️";
      return "●";
    }

    function isRunningActivity(activity) {
      const value = `${activity?.type || ""} ${activity?.name || ""}`.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
      return /(^|\s)(run|running|carrera)(\s|$)/.test(value) || /^trailrun/.test(value);
    }

    function activityDuration(activity) {
      return isNumber(activity?.movingSec) ? activity.movingSec : activity?.elapsedSec;
    }

    function activityCardMetrics(activity) {
      if (isRunningActivity(activity)) {
        return [
          ["Distancia", isNumber(activity.distanceM) ? formatNumber(activity.distanceM / 1000, 2) : "—", "km"],
          ["Ritmo", formatPace(activity.movingPaceSecPerKm), isNumber(activity.movingPaceSecPerKm) ? "min/km" : ""]
        ];
      }
      return [
        ["Duración", formatDuration(activityDuration(activity)), ""],
        ["FC media", formatNumber(activity.heartRate?.averageBpm), isNumber(activity.heartRate?.averageBpm) ? "ppm" : ""]
      ];
    }

    function activityCompactSummary(activity) {
      return isRunningActivity(activity)
        ? `${formatDistance(activity.distanceM)} · ${formatPace(activity.movingPaceSecPerKm)} min/km`
        : `${formatDuration(activityDuration(activity))} · ${isNumber(activity.heartRate?.averageBpm) ? `${formatNumber(activity.heartRate.averageBpm)} ppm` : "FC —"}`;
    }

    function renderActivities() {
      const rows = [...state.activities].sort((a, b) => String(b.start?.local || "").localeCompare(String(a.start?.local || "")));
      $("#activityCount").textContent = rows.length ? `${rows.length} registradas` : "";
      $("#activityList").innerHTML = rows.length ? rows.map(activity => {
        const metrics = activityCardMetrics(activity);
        return `
        <button class="activity-card" type="button" data-activity-id="${escapeHtml(activity.id)}">
          <span class="activity-icon" aria-hidden="true">${activityIcon(activity.type, activity.name)}</span>
          <span class="activity-copy"><span>${formatDate(activityDateKey(activity), { weekday: "short", day: "numeric", month: "short", year: "numeric" })}</span><strong>${escapeHtml(activity.name)}</strong></span>
          <span class="activity-stats">
            ${metrics.map(([label, value, unit]) => `<span class="activity-stat"><span>${label}</span><strong>${value}${unit ? `<small>${unit}</small>` : ""}</strong></span>`).join("")}
          </span>
        </button>`;
      }).join("") : emptyState("🏃🏻‍♂️", "Aún no hay actividades", "Configura la conexión y pulsa Actualizar para descargar tus entrenamientos de Intervals.icu.", true);
      $$('[data-activity-id]', $("#activityList")).forEach(button => button.addEventListener("click", () => openActivity(button.dataset.activityId)));
    }

    function emptyState(icon, title, text, withButton = false) {
      return `<div class="card empty-state"><div class="empty-icon">${icon}</div><h3>${escapeHtml(title)}</h3><p>${escapeHtml(text)}</p>${withButton ? '<button class="primary-button" type="button" data-empty-sync>Actualizar</button>' : ""}</div>`;
    }

    function renderPlan() {
      const cursor = state.monthCursor;
      const year = cursor.getFullYear();
      const month = cursor.getMonth();
      const first = new Date(year, month, 1, 12);
      const days = new Date(year, month + 1, 0, 12).getDate();
      const leading = (first.getDay() + 6) % 7;
      const monthPrefix = `${year}-${String(month + 1).padStart(2, "0")}`;
      if (!state.selectedPlanDate?.startsWith(monthPrefix)) state.selectedPlanDate = todayKey().startsWith(monthPrefix) ? todayKey() : `${monthPrefix}-01`;
      const rawMonthName = new Intl.DateTimeFormat("es-ES", { month: "long" }).format(first);
      const monthName = rawMonthName.charAt(0).toUpperCase() + rawMonthName.slice(1);
      $("#monthTitle").innerHTML = `<span class="calendar-year">${year}</span><span class="calendar-month">${escapeHtml(monthName)}</span>`;
      const byDay = new Map();
      const wellnessByDay = new Map(state.wellness.map(item => [item.date, item]));
      for (const activity of state.activities) {
        const key = activityDateKey(activity);
        if (!key) continue;
        if (!byDay.has(key)) byDay.set(key, []);
        byDay.get(key).push({ icon: activityIcon(activity.type, activity.name), name: activity.name, done: true, activityId: activity.id });
      }
      for (const event of state.calendar) {
        const key = String(event.startLocal || "").slice(0, 10);
        if (!key) continue;
        if (!byDay.has(key)) byDay.set(key, []);
        const icon = activityIcon(`${event.type || ""} ${event.category || ""}`, event.name);
        const completed = (byDay.get(key) || []).some(item => item.done);
        byDay.get(key).unshift({ icon, name: event.name || event.type || "Entrenamiento", done: completed });
      }
      const cells = Array.from({ length: leading }, () => '<div class="day-cell blank"></div>');
      for (let day = 1; day <= days; day += 1) {
        const key = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const items = byDay.get(key) || [];
        const wellness = wellnessByDay.get(key);
        const health = isNumber(wellness?.recovery?.sleepSeconds)
          ? `<span class="day-sleep ${qualityClass(wellness.recovery.sleepQualityLabel)}" title="Sueño ${qualityLabel(wellness.recovery.sleepQualityLabel).toLowerCase()}">💤${formatCompactSleep(wellness.recovery.sleepSeconds)}</span>`
          : "";
        const visible = items.slice(0, 2).map(item => `<span class="day-item ${item.done ? "done" : ""}" title="${escapeHtml(item.name)}">${item.icon} ${escapeHtml(item.name)}</span>`).join("");
        cells.push(`<button class="day-cell ${key === todayKey() ? "today" : ""} ${key === state.selectedPlanDate ? "selected" : ""}" type="button" data-calendar-date="${key}" aria-label="Ver ${formatDate(key, { day: "numeric", month: "long", year: "numeric" })}"><span class="day-number">${day}</span><span class="day-items">${visible}${items.length > 2 ? `<span class="day-more">+${items.length - 2}</span>` : ""}</span>${health ? `<span class="day-health">${health}</span>` : ""}</button>`);
      }
      $("#monthGrid").innerHTML = cells.join("");
      $$('[data-calendar-date]', $("#monthGrid")).forEach(button => button.addEventListener("click", () => {
        state.selectedPlanDate = button.dataset.calendarDate;
        renderPlan();
        $("#planDayDetail")?.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }));
      renderPlanDayDetail(state.selectedPlanDate);
    }

    function renderPlanDayDetail(date) {
      const wellness = state.wellness.find(item => item.date === date);
      const recovery = wellness?.recovery || {};
      const load = wellness?.load || {};
      const body = wellness?.body || {};
      const activities = state.activities.filter(item => activityDateKey(item) === date);
      const planned = state.calendar.filter(item => String(item.startLocal || "").slice(0, 10) === date);
      const metrics = [
        ["💤 Sueño", formatSleep(recovery.sleepSeconds)],
        ["⭐ Puntuación", isNumber(recovery.sleepScore) ? `${formatNumber(recovery.sleepScore)}/100` : "—"],
        ["〰️ VFC", isNumber(recovery.hrvRmssdMs) ? `${formatNumber(recovery.hrvRmssdMs)} ms` : "—"],
        ["❤️ FC reposo", isNumber(recovery.restingHeartRateBpm) ? `${formatNumber(recovery.restingHeartRateBpm)} ppm` : "—"],
        ["👟 Pasos", isNumber(body.steps) ? formatNumber(body.steps) : "—"],
        ["📈 CTL / ATL", isNumber(load.ctl) && isNumber(load.atl) ? `${formatNumber(load.ctl, 1)} / ${formatNumber(load.atl, 1)}` : "—"]
      ];
      const activityMarkup = activities.map(activity => `
        <button class="plan-activity-button" type="button" data-plan-activity-id="${escapeHtml(activity.id)}">
          <span class="sport" aria-hidden="true">${activityIcon(activity.type, activity.name)}</span>
          <span class="copy"><strong>${escapeHtml(activity.name)}</strong><span>${activityCompactSummary(activity)}</span></span>
          <span class="open" aria-hidden="true">›</span>
        </button>`).join("");
      const plannedMarkup = planned.map(event => `
        <div class="plan-activity-button">
          <span class="sport" aria-hidden="true">${activityIcon(`${event.type || ""} ${event.category || ""}`, event.name)}</span>
          <span class="copy"><strong>${escapeHtml(event.name || event.type || "Entrenamiento")}</strong><span>${isNumber(event.distanceM) ? formatDistance(event.distanceM) : "Planificado"}${isNumber(event.movingTimeSec) ? ` · ${formatDuration(event.movingTimeSec)}` : ""}</span></span>
          <span class="open" aria-hidden="true">${activities.length ? "✓" : ""}</span>
        </div>`).join("");
      $("#planDayDetail").innerHTML = `
        <article class="card plan-day-detail">
          <div class="plan-day-head"><div><p>Detalle del día</p><h3>${formatDate(date, { weekday: "long", day: "numeric", month: "long" })}</h3></div>${date === todayKey() ? '<span class="status-pill">Hoy</span>' : ""}</div>
          <div class="day-health-grid">${metrics.map(([label, value]) => `<div class="day-health-metric"><span>${label}</span><strong>${value}</strong></div>`).join("")}</div>
          ${activities.length ? `<div class="plan-day-section"><h4>Actividad realizada</h4>${activityMarkup}</div>` : '<p class="plan-empty">No hay actividad registrada este día.</p>'}
          ${planned.length ? `<div class="plan-day-section"><h4>Entrenamiento previsto</h4>${plannedMarkup}</div>` : ""}
        </article>`;
      $$('[data-plan-activity-id]', $("#planDayDetail")).forEach(button => button.addEventListener("click", () => openActivity(button.dataset.planActivityId)));
    }

    function renderManage() {
      const lastSync = state.lastSyncAt ? new Intl.DateTimeFormat("es-ES", { dateStyle: "medium", timeStyle: "short" }).format(new Date(state.lastSyncAt)) : "Nunca";
      $("#appVersionLabel").textContent = `TɅLOS ${APP_VERSION}`;
      $("#manageContent").innerHTML = `
        <article class="card manage-card">
          <h3><span class="connection-dot ${state.hasToken ? "ok" : ""}"></span>Conexión con Intervals.icu</h3>
          <p>${state.hasToken ? `Configurada. Última actualización: ${escapeHtml(lastSync)}.` : "Falta guardar el token privado en este dispositivo."}</p>
          <div class="button-row"><button class="primary-button" type="button" data-manage-sync>Actualizar</button><button class="secondary-button" type="button" data-configure>Configurar conexión</button></div>
        </article>
        <article class="card manage-card">
          <h3>Base de datos</h3>
          <p>Los datos permanecen en IndexedDB. La copia JSON permite trasladarlos entre dispositivos.</p>
          <div class="manage-stats"><div class="manage-stat"><strong>${state.activities.length}</strong><span>ACTIVIDADES</span></div><div class="manage-stat"><strong>${state.wellness.length}</strong><span>DÍAS</span></div><div class="manage-stat"><strong>${state.calendar.length}</strong><span>PLANES</span></div></div>
          <div class="button-row"><button class="secondary-button" type="button" data-export>Exportar JSON</button><button class="secondary-button" type="button" data-import>Importar JSON</button><button class="secondary-button" type="button" data-rebuild>Reconstruir desde Intervals</button></div>
        </article>
        <article class="card manage-card">
          <h3>Arquitectura activa</h3>
          <p>Intervals.icu para sincronización, streams para el detalle y FIT como respaldo. Base local: ${escapeHtml(state.dataDbName || DATA_DB_DEFAULT)}.</p>
          <div class="button-row"><button class="secondary-button" type="button" data-download-worker>Comprobar Worker</button></div>
        </article>
        <article class="card manage-card">
          <h3>Restablecer datos sincronizados</h3>
          <p>Elimina actividades, bienestar, calendario y mapas de este dispositivo. La conexión privada se conserva.</p>
          <div class="button-row"><button class="danger-button" type="button" data-clear>Vaciar datos locales</button></div>
        </article>`;
      $("[data-manage-sync]").addEventListener("click", () => syncNow({ manual: true }));
      $("[data-configure]").addEventListener("click", openConnectionDialog);
      $("[data-export]").addEventListener("click", exportBackup);
      $("[data-import]").addEventListener("click", () => $("#importInput").click());
      $("[data-rebuild]").addEventListener("click", rebuildFromIntervals);
      $("[data-download-worker]").addEventListener("click", () => window.open(state.workerUrl, "_blank", "noopener"));
      $("[data-clear]").addEventListener("click", clearSyncedData);
    }

    function setView(view) {

    function showToast(message, error = false) {
      const toast = $("#toast");
      clearTimeout(state.toastTimer);
      toast.textContent = message;
      toast.classList.toggle("error", error);
      toast.classList.add("show");

    function setSyncing(value) {
      state.syncing = value;

    async function syncNow({ manual = false } = {}) {
      if (state.syncing) return;
      const token = await connectionGet("accessToken").catch(() => "");
      if (!token) {
        openConnectionDialog();
        if (manual) showToast("Configura la conexión una sola vez en este dispositivo.");
        return;
      }
      if (!navigator.onLine) {
        showToast("No hay conexión a internet. TɅLOS conserva los datos locales.", true);
        return;
      }
      setSyncing(true);
      if (manual) showToast("Actualizando actividades y recuperación…");
      try {
        const body = state.lastSyncAt ? { lastSyncAt: state.lastSyncAt, includeDetails: true, includeCalendar: true } : { days: 60, includeDetails: true, includeCalendar: true };
        const response = await fetch(`${state.workerUrl}/sync`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Talos-Access": token },
          body: JSON.stringify(body)
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || !payload.ok) throw new Error(payload.error || (payload.warnings || []).join(" ") || `No se pudo actualizar (HTTP ${response.status}).`);
        const result = await persistSyncPayload(payload);
        state.hasToken = true;
        renderAll();
        const summary = `${result.activityCount} actividades y ${result.wellnessCount} días revisados`;
        showToast(result.newActivities || result.newWellness ? `Actualizado: ${summary}.` : `Sin cambios: ${summary}.`);
      } catch (error) {
        const message = error instanceof TypeError ? "El navegador no puede contactar con el Worker. Revisa la conexión y que el Worker esté desplegado." : (error.message || String(error));
        showToast(message, true);
      } finally {
        setSyncing(false);
      }
    }

    function dateKeyUtc(date) {
      return `${date.getUTCFullYear()}-${String(date.getUTCMonth() + 1).padStart(2, "0")}-${String(date.getUTCDate()).padStart(2, "0")}`;
    }

    async function rebuildFromIntervals() {
      if (state.syncing) return;
      const token = await connectionGet("accessToken").catch(() => "");
      if (!token) return openConnectionDialog();
      if (!confirm("¿Reconstruir el histórico de Intervals.icu desde 2014? Puede tardar varios minutos, pero no creará duplicados.")) return;
      setSyncing(true);
      let cursor = new Date(`${todayKey()}T12:00:00Z`);
      const minimum = new Date("2014-01-01T12:00:00Z");
      let windows = 0;
      try {
        while (cursor >= minimum) {
          const oldestDate = new Date(Math.max(minimum.getTime(), cursor.getTime() - 59 * DAY_MS));
          const oldest = dateKeyUtc(oldestDate);
          const newest = dateKeyUtc(cursor);
          showToast(`Reconstruyendo ${formatDate(oldest, { month: "short", year: "numeric" })} – ${formatDate(newest, { month: "short", year: "numeric" })}…`);
          const response = await fetch(`${state.workerUrl}/sync`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-Talos-Access": token },
            body: JSON.stringify({ oldest, newest, includeDetails: true, includeCalendar: true })
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || !payload.ok) throw new Error(payload.error || (payload.warnings || []).join(" ") || `Falló el bloque ${oldest} – ${newest}.`);
          await persistSyncPayload(payload, { reload: false });
          windows += 1;
          cursor = new Date(oldestDate.getTime() - DAY_MS);
        }
        await loadLocalData();
        renderAll();
        showToast(`Histórico reconstruido: ${state.activities.length} actividades y ${state.wellness.length} días guardados.`);
      } catch (error) {
        await loadLocalData().catch(() => {});
        renderAll();
        showToast(`${error.message || error} Se conservaron ${windows} bloques ya completados.`, true);
      } finally {
        setSyncing(false);
      }
    }

    function intervalPaceColor(intensity) {
      if (intensity >= .82) return "#e5574f";
      if (intensity >= .62) return "#ee8446";
      if (intensity >= .42) return "#e8b544";
      if (intensity >= .22) return "#55aa9a";

    function activityDetailMarkup(activity) {

      const optionalDynamics = [
        isNumber(dynamics.groundContactTimeMs) ? `<div class="detail-item"><span>🦶 Contacto suelo</span><strong>${formatNumber(dynamics.groundContactTimeMs)} ms</strong></div>` : "",
        isNumber(dynamics.verticalOscillationCm) ? `<div class="detail-item"><span>↕️ Oscilación vertical</span><strong>${formatNumber(dynamics.verticalOscillationCm, 1)} cm</strong></div>` : ""
      ].filter(Boolean).join("");
      const heroMarkup = running ? `
          <div class="hero-stat"><span>Distancia</span><strong>${isNumber(activity.distanceM) ? formatNumber(activity.distanceM / 1000, 2) : "—"} <small>km</small></strong></div>
          <div class="hero-stat"><span>Ritmo mov.</span><strong>${formatPace(activity.movingPaceSecPerKm)} <small>/km</small></strong></div>
          <div class="hero-stat"><span>Tiempo</span><strong>${formatDuration(duration)}</strong></div>` : `
          <div class="hero-stat"><span>Duración</span><strong>${formatDuration(duration)}</strong></div>
          <div class="hero-stat"><span>FC media</span><strong>${formatNumber(heart.averageBpm)} <small>ppm</small></strong></div>
          <div class="hero-stat"><span>Calorías</span><strong>${formatNumber(activity.caloriesKcal)} <small>kcal</small></strong></div>`;
      const runningDetails = [
        `<div class="detail-item"><span>❤️ FC media / máxima</span><strong>${formatNumber(heart.averageBpm)} / ${formatNumber(heart.maxBpm)} ppm</strong></div>`,
        isNumber(dynamics.averageCadenceSpm) ? `<div class="detail-item"><span>👟 Cadencia</span><strong>${formatNumber(dynamics.averageCadenceSpm)} spm</strong></div>` : "",
        power.streamAvailable || power.available || isNumber(power.averageWatts) ? `<div class="detail-item"><span>⚡ Potencia</span><strong id="detailPower">${isNumber(power.averageWatts) ? `${formatNumber(power.averageWatts)} W` : "Cargando…"}</strong></div>` : "",
        isNumber(load.trainingLoad) ? `<div class="detail-item"><span>📈 Carga</span><strong>${formatNumber(load.trainingLoad)}</strong></div>` : "",
        isNumber(elevation.gainM) ? `<div class="detail-item"><span>⛰️ Ascenso corregido</span><strong>${formatNumber(elevation.gainM)} m</strong></div>` : "",
        isNumber(temperature.averageC) ? `<div class="detail-item"><span>🌡️ Temperatura</span><strong>${formatNumber(temperature.averageC, 1)} °C</strong></div>` : "",
        optionalDynamics
      ].filter(Boolean).join("");
      const otherDetails = [
        isNumber(heart.maxBpm) ? `<div class="detail-item"><span>❤️ FC máxima</span><strong>${formatNumber(heart.maxBpm)} ppm</strong></div>` : "",
        isNumber(load.trainingLoad) ? `<div class="detail-item"><span>📈 Carga</span><strong>${formatNumber(load.trainingLoad)}</strong></div>` : "",
        isNumber(load.intensity) ? `<div class="detail-item"><span>⚡ Intensidad</span><strong>${formatNumber(load.intensity, 0)}</strong></div>` : "",
        isNumber(activity.elapsedSec) && Math.abs(activity.elapsedSec - duration) > 1 ? `<div class="detail-item"><span>⏱️ Tiempo total</span><strong>${formatDuration(activity.elapsedSec)}</strong></div>` : "",
        hasRoute && isNumber(activity.distanceM) ? `<div class="detail-item"><span>📍 Distancia</span><strong>${formatDistance(activity.distanceM)}</strong></div>` : "",
        isNumber(elevation.gainM) ? `<div class="detail-item"><span>⛰️ Ascenso</span><strong>${formatNumber(elevation.gainM)} m</strong></div>` : "",
        isNumber(temperature.averageC) ? `<div class="detail-item"><span>🌡️ Temperatura</span><strong>${formatNumber(temperature.averageC, 1)} °C</strong></div>` : "",
        power.streamAvailable || isNumber(power.averageWatts) ? `<div class="detail-item"><span>⚡ Potencia</span><strong id="detailPower">${isNumber(power.averageWatts) ? `${formatNumber(power.averageWatts)} W` : "Cargando…"}</strong></div>` : ""
      ].filter(Boolean).join("");
      return `
        <div class="activity-hero">
