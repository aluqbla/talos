        <div class="detail-grid">${running ? runningDetails : otherDetails}</div>
        ${runningIntervals || otherIntervals}
        <div class="dialog-actions"><button class="secondary-button" type="button" data-download-fit="${escapeHtml(activity.id)}">Descargar FIT original</button></div>`;
    }

    async function openActivity(id) {
      const activity = state.activities.find(item => item.id === id);
      if (!activity) return;
      $("#activityDialogTitle").textContent = activity.name;
      $("#activityDialogContent").innerHTML = activityDetailMarkup(activity);
      openDialog($("#activityDialog"));
      $("[data-download-fit]", $("#activityDialogContent"))?.addEventListener("click", () => downloadOriginalFit(activity));
      await loadAndRenderStreams(activity);
    }

    function streamMap(rows) {
      const map = new Map();
      if (Array.isArray(rows)) {
        for (const row of rows) {
          if (!row?.type || row.data === undefined) continue;
          const type = String(row.type).toLowerCase();
          if (type === "latlng" && Array.isArray(row.data) && Array.isArray(row.data2)) {
            map.set(type, row.data.map((latitude, index) => [latitude, row.data2[index]]));
          } else {
            map.set(type, row.data);
          }
        }
      } else if (rows && typeof rows === "object") {
        for (const [type, value] of Object.entries(rows)) {
          const key = type.toLowerCase();
          if (key === "latlng" && Array.isArray(value?.data) && Array.isArray(value?.data2)) {
            map.set(key, value.data.map((latitude, index) => [latitude, value.data2[index]]));
          } else {
            map.set(key, value?.data ?? value);
          }
        }
      }
      return map;
    }

    function validCoordinatePair(latitude, longitude) {
      if (latitude === null || latitude === undefined || longitude === null || longitude === undefined || latitude === "" || longitude === "") return null;
      const lat = Number(latitude);
      const lng = Number(longitude);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
      if (Math.abs(lat) > 90 || Math.abs(lng) > 180 || (lat === 0 && lng === 0)) return null;
      return [lat, lng];
    }

    function coordinateFromValue(value) {
      if (Array.isArray(value) && value.length >= 2) return validCoordinatePair(value[0], value[1]);
      if (value && typeof value === "object") {
        return validCoordinatePair(value.lat ?? value.latitude ?? value[0], value.lng ?? value.lon ?? value.longitude ?? value[1]);
      }
      if (typeof value === "string") {
        const numbers = value.match(/-?\d+(?:\.\d+)?/g)?.map(Number) || [];
        if (numbers.length >= 2) return validCoordinatePair(numbers[0], numbers[1]);
      }
      return null;
    }

    function decodePolyline(value) {
      if (typeof value !== "string" || value.length < 8) return [];
      const points = [];
      let index = 0, latitude = 0, longitude = 0;
      try {
        while (index < value.length) {
          let result = 0, shift = 0, byte;
          do { byte = value.charCodeAt(index++) - 63; result |= (byte & 31) << shift; shift += 5; } while (byte >= 32 && index <= value.length);
          latitude += result & 1 ? ~(result >> 1) : result >> 1;
          result = 0; shift = 0;
          do { byte = value.charCodeAt(index++) - 63; result |= (byte & 31) << shift; shift += 5; } while (byte >= 32 && index <= value.length);
          longitude += result & 1 ? ~(result >> 1) : result >> 1;
          const point = validCoordinatePair(latitude / 1e5, longitude / 1e5);
          if (point) points.push(point);
        }
      } catch (_) { return []; }
      return points;
    }

    function extractCoordinates(data) {
      if (typeof data === "string") {
        const trimmed = data.trim();
        if (/^[\[{]/.test(trimmed)) {
          try { return extractCoordinates(JSON.parse(trimmed)); } catch (_) {}
        }
        const numbers = trimmed.match(/-?\d+(?:\.\d+)?/g)?.map(Number) || [];
        if (numbers.length >= 4) {
          const pairs = [];
          for (let index = 0; index + 1 < numbers.length; index += 2) {
            const point = validCoordinatePair(numbers[index], numbers[index + 1]);
            if (point) pairs.push(point);
          }
          if (pairs.length) return pairs;
        }
        const single = coordinateFromValue(trimmed);
        return single ? [single] : decodePolyline(trimmed);
      }
      if (!Array.isArray(data)) return [];
      return data.map(coordinateFromValue).filter(Boolean);
    }

    function coordinateDistanceMeters(first, second) {
      const radians = value => value * Math.PI / 180;
      const latitudeDelta = radians(second[0] - first[0]);
      const longitudeDelta = radians(second[1] - first[1]);
      const firstLatitude = radians(first[0]);
      const secondLatitude = radians(second[0]);
      const haversine = Math.sin(latitudeDelta / 2) ** 2
        + Math.cos(firstLatitude) * Math.cos(secondLatitude) * Math.sin(longitudeDelta / 2) ** 2;
      return 6371000 * 2 * Math.atan2(Math.sqrt(haversine), Math.sqrt(1 - haversine));
    }

    function splitRouteSegments(coordinates, maximumJumpMeters = 750) {
      const segments = [];
      let current = [];
      for (const point of coordinates) {
        if (current.length && coordinateDistanceMeters(current.at(-1), point) > maximumJumpMeters) {
          if (current.length > 1) segments.push(current);
          current = [];
        }
        current.push(point);
      }
      if (current.length > 1) segments.push(current);
      return segments;
    }

    async function loadAndRenderStreams(activity) {
      const message = $("#mapMessage");
      const mapNode = $("#routeMap");
      const powerNode = $("#detailPower");
      if (!mapNode && !powerNode) return;
      if (mapNode && !activity.streamTypes?.includes("latlng")) {
        if (message) message.textContent = "Esta actividad no contiene coordenadas GPS.";
        return;
      }
      try {
        let cache = await storeGet(DATA_STORES.streams, activity.id);
        if (!cache?.streams || cache.cacheVersion !== STREAM_CACHE_VERSION) {
          const token = await connectionGet("accessToken");
          const types = "latlng,distance,time,altitude,velocity_smooth,heartrate,cadence,watts,respiration";
          const response = await fetch(`${state.workerUrl}/activity/${encodeURIComponent(activity.id)}/streams?types=${types}`, { headers: { "X-Talos-Access": token } });
          const payload = await response.json().catch(() => null);
          if (!response.ok) throw new Error(payload?.error || "No se pudo descargar el recorrido.");
          const streams = Array.isArray(payload) ? payload : payload?.streams ?? payload;
          cache = { id: activity.id, cacheVersion: STREAM_CACHE_VERSION, fetchedAt: new Date().toISOString(), streams };
          await storePut(DATA_STORES.streams, cache);
        }
        const streams = streamMap(cache.streams);
        if (mapNode) renderRouteMap(extractCoordinates(streams.get("latlng")));
        const watts = (streams.get("watts") || []).filter(value => isNumber(value) && value > 0);
        if (powerNode) powerNode.textContent = watts.length ? `${formatNumber(watts.reduce((sum, value) => sum + value, 0) / watts.length)} W` : "—";
      } catch (error) {
        if (message) message.textContent = error.message || String(error);
      }
    }

    function renderRouteMap(coordinates) {
      const message = $("#mapMessage");
      const segments = splitRouteSegments(coordinates);
      if (!segments.length) {
        if (message) message.textContent = "No se encontraron puntos válidos del recorrido.";
        return;
      }
      if (!window.L) return renderFallbackRoute(segments);
      if (state.map) {
        state.map.remove();
        state.map = null;
      }
      state.map = L.map("routeMap", { zoomControl: true, attributionControl: true, preferCanvas: true });
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(state.map);
      state.mapLayer = L.polyline(segments, { color: "#d05f5f", weight: 5, opacity: .94, lineCap: "round", lineJoin: "round" }).addTo(state.map);
      const firstPoint = segments[0][0];
      const lastPoint = segments.at(-1).at(-1);
      L.circleMarker(firstPoint, { radius: 6, color: "#c6f6d4", fillColor: "#46d47a", fillOpacity: 1, weight: 2 }).addTo(state.map).bindTooltip("Salida");
      L.circleMarker(lastPoint, { radius: 6, color: "#ffd6d3", fillColor: "#ff6862", fillOpacity: 1, weight: 2 }).addTo(state.map).bindTooltip("Llegada");
      state.map.fitBounds(state.mapLayer.getBounds(), { padding: [24, 24] });
      if (message) message.remove();
      setTimeout(() => state.map?.invalidateSize(), 100);
    }

    function renderFallbackRoute(segments) {
      const coordinates = segments.flat();
      const latitudes = coordinates.map(point => point[0]);
      const longitudes = coordinates.map(point => point[1]);
      const minLat = Math.min(...latitudes), maxLat = Math.max(...latitudes), minLng = Math.min(...longitudes), maxLng = Math.max(...longitudes);
      const width = 600, height = 340, padding = 24;
      const scaleX = value => padding + ((value - minLng) / (maxLng - minLng || 1)) * (width - padding * 2);
      const scaleY = value => height - padding - ((value - minLat) / (maxLat - minLat || 1)) * (height - padding * 2);
      const polylines = segments.map(segment => {
        const sampleEvery = Math.max(1, Math.floor(segment.length / 1200));
        const sampled = segment.filter((_, index) => index % sampleEvery === 0 || index === segment.length - 1);
        const points = sampled.map(point => `${scaleX(point[1]).toFixed(1)},${scaleY(point[0]).toFixed(1)}`).join(" ");
        return `<polyline points="${points}" fill="none" stroke="#d05f5f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`;
      }).join("");
      const firstPoint = segments[0][0];
      const lastPoint = segments.at(-1).at(-1);
      $("#routeMap").innerHTML = `<svg viewBox="0 0 ${width} ${height}" width="100%" height="100%" role="img" aria-label="Recorrido GPS"><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="rgba(255,255,255,.06)"/></pattern></defs><rect width="100%" height="100%" fill="#0a0e13"/><rect width="100%" height="100%" fill="url(#grid)"/>${polylines}<circle cx="${scaleX(firstPoint[1])}" cy="${scaleY(firstPoint[0])}" r="7" fill="#46d47a"/><circle cx="${scaleX(lastPoint[1])}" cy="${scaleY(lastPoint[0])}" r="7" fill="#ff6862"/></svg>`;
      $("#mapMessage")?.remove();
    }

    async function downloadOriginalFit(activity) {
      try {
        const token = await connectionGet("accessToken");
        const response = await fetch(`${state.workerUrl}/activity/${encodeURIComponent(activity.id)}/file`, { headers: { "X-Talos-Access": token } });
        if (!response.ok) throw new Error("No se pudo descargar el FIT original.");
        const blob = await response.blob();
        downloadBlob(blob, `${safeFilename(activity.name)}-${activityDateKey(activity)}.fit.gz`);
      } catch (error) {
        showToast(error.message || String(error), true);
      }
    }

    function safeFilename(value) {
      return String(value || "actividad").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9_-]+/gi, "-").replace(/^-+|-+$/g, "").slice(0, 70) || "actividad";
    }

    function downloadBlob(blob, filename) {
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1500);
    }

    async function exportBackup() {
      const [streams, subjective, settings] = await Promise.all([storeGetAll(DATA_STORES.streams), storeGetAll(DATA_STORES.subjective), storeGetAll(DATA_STORES.settings)]);
      const payload = {
        talosBackupVersion: 1,
        appVersion: APP_VERSION,
        exportedAt: new Date().toISOString(),
        activities: state.activities,
        wellness: state.wellness,
        calendar: state.calendar,
        streams,
        subjective,
        settings: settings.filter(item => item.key !== "accessToken")
      };
      downloadBlob(new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }), `talos-copia-${todayKey()}.json`);
      showToast("Copia JSON preparada.");
    }

    async function importJsonFile(file) {
      try {
        const payload = JSON.parse(await file.text());
        if (payload.talosBackupVersion) {
          await Promise.all([
            storePutMany(DATA_STORES.activities, (payload.activities || []).map(normalizeActivity).filter(Boolean)),
            storePutMany(DATA_STORES.wellness, (payload.wellness || []).map(normalizeWellness).filter(Boolean)),
            storePutMany(DATA_STORES.calendar, (payload.calendar || []).filter(item => item?.dedupeKey)),
            storePutMany(DATA_STORES.streams, (payload.streams || []).filter(item => item?.id)),
            storePutMany(DATA_STORES.subjective, (payload.subjective || []).filter(item => item?.date))
          ]);
          for (const setting of payload.settings || []) if (setting?.key && setting.key !== "accessToken") await storePut(DATA_STORES.settings, setting);
        } else if (Array.isArray(payload.activities) && Array.isArray(payload.wellness)) {
          await persistSyncPayload(payload);
        } else {
          throw new Error("El archivo no es una copia de TɅLOS ni un talos-sync.json válido.");
        }
        await loadLocalData();
        renderAll();
        showToast("Datos importados correctamente.");
      } catch (error) {
        showToast(error.message || "No se pudo importar el archivo.", true);
      }
    }

    async function clearSyncedData() {
      if (!confirm("¿Vaciar las actividades, el bienestar, el calendario y los mapas guardados en este dispositivo?")) return;
      await storeClear([DATA_STORES.activities, DATA_STORES.wellness, DATA_STORES.calendar, DATA_STORES.streams, DATA_STORES.subjective, DATA_STORES.settings]);
      await loadLocalData();
      renderAll();
      showToast("Datos locales eliminados. La conexión privada se conserva.");
    }

    function bindEvents() {
      $$(".nav-button").forEach(button => button.addEventListener("click", () => setView(button.dataset.target)));
      $("#syncTopButton").addEventListener("click", () => syncNow({ manual: true }));
      $("#connectionForm").addEventListener("submit", saveConnection);
      $$('[data-close-dialog]').forEach(button => button.addEventListener("click", () => closeDialog($(`#${button.dataset.closeDialog}`))));
      $("#activityDialog").addEventListener("close", () => {
        if (state.map) { state.map.remove(); state.map = null; }
      });
      $("#prevMonth").addEventListener("click", () => { state.monthCursor = new Date(state.monthCursor.getFullYear(), state.monthCursor.getMonth() - 1, 1, 12); renderPlan(); });
      $("#nextMonth").addEventListener("click", () => { state.monthCursor = new Date(state.monthCursor.getFullYear(), state.monthCursor.getMonth() + 1, 1, 12); renderPlan(); });
      $("#importInput").addEventListener("change", async event => { const file = event.target.files?.[0]; if (file) await importJsonFile(file); event.target.value = ""; });
      window.addEventListener("online", () => showToast("Conexión restablecida."));
    }

    async function init() {
      try {
        bindEvents();
        await loadLocalData();
        renderAll();
        if (state.hasToken) syncNow();
      } catch (error) {
        console.error("TALOS_INIT_ERROR", error);
        showToast(`No se pudo iniciar TɅLOS: ${error.message || error}`, true);
      }
    }

    init();
  })();
  </script>
</body>
</html>
